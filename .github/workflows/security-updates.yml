# Each day, a pull request with any Drupal security updates, tested by tests.yml.
# Off until you set them up: see docs/automatic-updates.md.
name: Daily Drupal security updates
on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *' # Every day at 20:00 UTC; daily checks also cover out-of-window releases.
permissions:
  contents: read
concurrency:
  group: drupal-dependency-updates
  cancel-in-progress: false
jobs:
  update:
    if: vars.DRUPAL_UPDATES == 'on' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require the automation token
        env:
          UPDATE_TOKEN: ${{ secrets.DRUPAL_UPDATE_TOKEN }}
        run: |
          if [ -z "$UPDATE_TOKEN" ]; then
            echo "Set DRUPAL_UPDATE_TOKEN so update PRs can trigger required checks."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.DRUPAL_UPDATE_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gd, pdo_mysql, mbstring, intl, bcmath, zip, opcache
          tools: composer:v2
          coverage: none
      - name: Upgrade selected packages
        uses: valicm/drupal-update@v6.0.0
        with:
          update_type: security
          update_scope: all
          security_update_pinned: 'true'
      - name: Validate Composer files and platform
        run: |
          composer validate --no-check-publish
          composer check-platform-reqs --lock
      # The pull request then runs tests.yml: coding standards and full installs.
      - name: Create or update the upgrade PR
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DRUPAL_UPDATE_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: updates/drupal-security
          title: Drupal security updates
          commit-message: Drupal security updates
          body: ${{ env.DRUPAL_UPDATES_TABLE }}
          # Keep scaffolded/config changes. Normal repository ignore rules still apply to
          # vendor and installed packages; the updater's backup directories ignore themselves.
          add-paths: |
            .
          delete-branch: true
      # Only with DRUPAL_UPDATES_AUTOMERGE on, repository automerge allowed and tests.yml
      # required on the base branch. This does not approve reviews or bypass protection.
      - name: Enable security PR automerge
        if: vars.DRUPAL_UPDATES_AUTOMERGE == 'on' && steps.pr.outputs.pull-request-number != '' && steps.pr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ secrets.DRUPAL_UPDATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$PR_HEAD_SHA"
