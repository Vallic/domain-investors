# Added to the site's server block, after the platform's rules.
#
# Domain pages end in the domain's own extension, and some extensions are ones
# the platform's Drupal rules refuse to serve, as they would be source files:
# example.sh, example.md, example.inc. Every path under /domain/ is a page
# Drupal answers (recipes/portfolio_base names domains /domain/NAME), so hand
# them all to Drupal, ahead of the platform's regular expressions.
location ^~ /domain/ {
    try_files $uri /index.php?$query_string;
}
