langcode: en
status: true
dependencies: {  }
id: tfa
label: 'Two-factor authentication'
description: 'Encrypts the secrets of two-factor authentication. Read from the TFA_ENCRYPTION_KEY environment variable (32 random bytes, base64: openssl rand -base64 32). Never holds a value of its own.'
key_type: encryption
key_type_settings:
  key_size: 256
key_provider: env
key_provider_settings:
  env_variable: TFA_ENCRYPTION_KEY
  base64_encoded: true
  strip_line_breaks: true
key_input: none
key_input_settings: {  }
