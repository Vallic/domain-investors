services:
  _defaults:
    autowire: true

  Drupal\domain_portfolio_tools\ProviderSetup:
    arguments:
      $providerPluginManager: '@plugin.manager.commerce_domains_provider'

  # Purge stays quiet where neither Varnish nor the Vallic CDN is there.
  Drupal\domain_portfolio_tools\Config\QuietPurgeOverride:
    arguments:
      $storage: '@config.storage'
    tags:
      - { name: config.factory.override, priority: 5 }

  Drupal\domain_portfolio_tools\EscrowSetup: ~

  Drupal\domain_portfolio_tools\DemoContent: ~

  logger.channel.domain_portfolio_tools:
    parent: logger.channel_base
    arguments: ['domain_portfolio_tools']

  Drupal\domain_portfolio_tools\EventSubscriber\HandoverOrderSubscriber:
    arguments:
      $logger: '@logger.channel.domain_portfolio_tools'
    tags:
      - { name: event_subscriber }
